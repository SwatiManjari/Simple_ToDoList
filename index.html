<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple To-Do List</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="card">

        <header class="header">
            <img src="./cat.png" alt="Cute cat">

            <div>
                <h1>My Tasks</h1>
            </div>
        </header>

        <section id="taskList" aria-label="Task list"></section>

        <div id="inputArea">
            <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task">
            <button id="addBtn" type="button" aria-label="Add task">+</button>
        </div>

    </main>

    <script src="./todo.js"></script>
</body>
</html>
